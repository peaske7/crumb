[package]
name = "crumb-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, minimal TUI and CLI for per-worktree development backends"
license = "MIT OR Apache-2.0"
repository = "https://github.com/peaske7/crumb"
homepage = "https://github.com/peaske7/crumb"
readme = "README.md"
keywords = ["worktree", "tui", "docker", "mutagen", "dev-environment"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "crumb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.37", features = ["serde"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
